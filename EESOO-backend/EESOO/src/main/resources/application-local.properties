
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eesoo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

management.endpoint.health.group.readiness.include=readinessState,db

spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


app.rate-limit.login=20
app.rate-limit.register=10
app.rate-limit.refresh=30
app.rate-limit.device-store=20
app.rate-limit.device-check=20
app.rate-limit.pin-reset-confirm-mobile=10
app.rate-limit.pin-reset-issue=10


app.cors.allowed-origins=http://localhost:5173,http://localhost:3000