
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.forward-headers-strategy=framework

server.error.include-message=never
server.error.include-stacktrace=never

spring.devtools.add-properties=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.h2.console.enabled=false

spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

management.endpoint.health.group.readiness.include=readinessState,db

app.rate-limit.login=${APP_RATE_LIMIT_LOGIN:5}
app.rate-limit.register=${APP_RATE_LIMIT_REGISTER:3}
app.rate-limit.refresh=${APP_RATE_LIMIT_REFRESH:10}
app.rate-limit.device-store=${APP_RATE_LIMIT_DEVICE_STORE:10}
app.rate-limit.device-check=${APP_RATE_LIMIT_DEVICE_CHECK:10}
app.rate-limit.pin-reset-confirm-mobile=${APP_RATE_LIMIT_PIN_RESET_CONFIRM_MOBILE:3}
app.rate-limit.pin-reset-issue=${APP_RATE_LIMIT_PIN_RESET_ISSUE:3}


spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Browser origins allowed in production
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}